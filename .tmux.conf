# Reload config with prefix + r (clears default `r` binding first).
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Use Ctrl-a as prefix instead of default Ctrl-b (closer to home row, frees Ctrl-b for vim page-up).
set -g prefix C-a

# Number windows/panes from 1 instead of 0 (matches keyboard layout: 1 is leftmost).
set -g base-index 1
setw -g pane-base-index 1

# When a window is closed, renumber the rest so there are no gaps (1,2,4 -> 1,2,3).
set -g renumber-windows on

# Scrollback buffer size per pane. 50k handles long build/test logs without truncation.
set -g history-limit 50000

# Tell tmux it's running inside a 256-color terminal (required for proper color rendering).
set -g default-terminal "tmux-256color"

# Tell tmux that the outer terminal (Ghostty) supports truecolor (24-bit RGB).
# Without this, themes with hex colors fall back to 256-color approximations.
set -ag terminal-features ",xterm-ghostty:RGB"

# OSC 8 hyperlinks: lets `ls`, `gh`, etc. emit clickable links that Ghostty can open.
set -as terminal-features ",xterm-ghostty:hyperlinks"

# Undercurl + colored underlines: nvim/LSP uses these for diagnostics (squiggly red errors).
set -as terminal-features ",xterm-ghostty:usstyle"

# Tells tmux that Ghostty handles the OSC 52 clipboard escape (pairs with set-clipboard below).
set -as terminal-features ",xterm-ghostty:clipboard"

# Time tmux waits after ESC to detect a meta/alt key sequence. 0 makes vim/nvim feel instant.
set -sg escape-time 0

# Enable mouse: scroll wheel, click to select pane/window, drag to resize panes.
set -g mouse on

# Forward terminal focus events to apps inside tmux (vim/nvim autoread, etc.).
set -g focus-events on

# Allow tmux to write yanked text to the system clipboard via OSC 52 (works over SSH too).
set -g set-clipboard on

# Allow apps inside tmux to send escape sequences directly to the outer terminal.
# Required for kitty graphics protocol (image.nvim, molten.nvim, etc.).
set -g allow-passthrough on

# How long status messages (e.g. "tmux.conf reloaded.") stay on screen. Default 750ms is too quick.
set -g display-time 2000

# When the same session is attached from multiple clients of different sizes,
# resize each window to the smallest *currently viewing* client instead of the smallest attached.
setw -g aggressive-resize on

# Vim-style pane navigation with prefix + h/j/k/l.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# More memorable splits: v = vertical split (side by side), s = horizontal split (stacked).
bind-key v split-window -h
bind-key s split-window -v

# `s` was tmux's session picker; keep it reachable on S (w still lists windows too).
bind-key S choose-tree -Zs

# Use vi keybindings in copy mode (hjkl to move, v to select, y to yank).
setw -g mode-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'                      # Plugin manager itself.
set -g @plugin 'christoomey/vim-tmux-navigator'        # Seamless Ctrl-h/j/k/l between vim splits and tmux panes.
set -g @plugin 'tmux-plugins/tmux-resurrect'           # Save/restore sessions across reboots (prefix + Ctrl-s / Ctrl-r).
set -g @plugin 'tmux-plugins/tmux-continuum'           # Auto-saves resurrect state every 15 min.
set -g @continuum-restore 'on'                         # Auto-restore last session when tmux server starts.
set -g @plugin 'tmux-plugins/tmux-yank'                # Copy to system clipboard from copy mode (y / Y).


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
